name: release

on:
  push:
    tags: ['v*']
  # Cuts a release from whatever branch is selected, creating the tag if it
  # does not exist yet. Also re-runs a release whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, created at the selected commit if new (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: universal macOS app
    runs-on: macos-latest
    steps:
      # No explicit ref: a tag push checks out the tag, a manual run checks out
      # the branch chosen in the Actions UI.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary. The runner is Apple Silicon,
          # so the Intel target is the one that must be added explicitly.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Checked before the build, not during it: signing failures otherwise
      # surface ten minutes in, after both architectures have compiled.
      - name: Verify the signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Shape first, so a mispasted secret is named precisely. Nothing here
          # prints the key itself — only its length and whether it decodes.
          node -e '
            const key = (process.env.TAURI_SIGNING_PRIVATE_KEY || "").trim();
            if (!key) {
              console.log("::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings -> Secrets and variables -> Actions.");
              process.exit(1);
            }
            console.log(`key: ${key.length} characters, ${key.split("\n").length} line(s)`);
            let head = "";
            try { head = Buffer.from(key.slice(0, 24), "base64").toString("utf8"); } catch {}
            if (!head.startsWith("untrusted comment")) {
              console.log("::error::TAURI_SIGNING_PRIVATE_KEY does not look like a Tauri signing key. It is ONE long single line of base64 starting with dW50cnVzdGVkIGNvbW1lbnQ6 - paste the whole contents of the .key file and nothing else (no surrounding notes, no partial selection).");
              process.exit(1);
            }
          '
          # Then prove it actually signs, which catches a wrong password too.
          # The key is one line of base64, so removing whitespace is lossless
          # and neutralises anything the paste picked up.
          TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')
          export TAURI_SIGNING_PRIVATE_KEY
          # GitHub refuses to store an empty secret, so "this key has no
          # password" gets recorded as a space. Treat a whitespace-only value
          # as no password — otherwise the space IS the password, and signing
          # fails with the thoroughly unhelpful "Wrong password for that key".
          if [ -z "$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" | tr -d '[:space:]')" ]; then
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          echo "signing-key-check" > /tmp/signing-check.txt
          if ! npm run --silent tauri -- signer sign /tmp/signing-check.txt > /dev/null 2>/tmp/sign-err.txt; then
            echo "::error::The signing key was rejected: $(tr -d '\n' < /tmp/sign-err.txt | tail -c 300)"
            echo "::error::If this says 'Wrong password', the key and TAURI_SIGNING_PRIVATE_KEY_PASSWORD disagree. A whitespace-only secret is already treated as no password, so this means a real password mismatch."
            exit 1
          fi
          echo "signing key verified"

      - name: Build universal .app and .dmg
        env:
          # The updater will not install an unsigned bundle, and signing
          # cannot be disabled.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Same normalisation as the verification step above.
          TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')
          export TAURI_SIGNING_PRIVATE_KEY
          # GitHub refuses to store an empty secret, so "this key has no
          # password" gets recorded as a space. Treat a whitespace-only value
          # as no password — otherwise the space IS the password, and signing
          # fails with the thoroughly unhelpful "Wrong password for that key".
          if [ -z "$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" | tr -d '[:space:]')" ]; then
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Verify the binary really is universal
        # A silently arch-specific build would install fine on this runner and
        # fail on half the Macs that download it, so fail the release instead.
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Inbox Sweep.app"
          BIN="$APP/Contents/MacOS/inbox-sweep"
          echo "Architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q "x86_64" || { echo "::error::missing x86_64 slice"; exit 1; }
          lipo -archs "$BIN" | grep -q "arm64"  || { echo "::error::missing arm64 slice"; exit 1; }

      - name: Package
        id: package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-release

          # ditto, not zip: it preserves the bundle's symlinks, permissions and
          # extended attributes, which a plain zip mangles.
          ditto -c -k --sequesterRsrc --keepParent \
            "$BUNDLE/macos/Inbox Sweep.app" \
            "dist-release/Inbox-Sweep-${VERSION}-macos-universal.zip"

          # The dmg filename carries Tauri's own version, so find it rather
          # than assuming.
          cp "$BUNDLE"/dmg/*.dmg "dist-release/Inbox-Sweep-${VERSION}-macos-universal.dmg"

          # The updater consumes the .app.tar.gz, not the .dmg.
          #
          # Tauri names it "Inbox Sweep.app.tar.gz", and GitHub rewrites spaces
          # in release asset names to dots — so a manifest built from the local
          # filename points at a URL that does not exist, and every update
          # fails on download while the release looks perfectly healthy.
          # Renaming to a space-free name first removes the guesswork.
          UPDATER=$(ls "$BUNDLE"/macos/*.app.tar.gz)
          SIGNATURE=$(cat "$UPDATER.sig")
          UPDATER_NAME="Inbox-Sweep-${VERSION}-macos-universal.app.tar.gz"
          cp "$UPDATER" "dist-release/$UPDATER_NAME"

          # A universal binary serves both architectures, so both entries point
          # at the same artifact.
          node -e '
            const [version, name, signature] = process.argv.slice(1);
            const url = `https://github.com/sparkly-quasar/inbox-sweep/releases/download/v${version}/${encodeURIComponent(name)}`;
            const platform = { signature, url };
            console.log(JSON.stringify({
              version,
              notes: `Inbox Sweep ${version} — see the release notes.`,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-x86_64": platform,
                "darwin-aarch64": platform,
                "darwin-universal": platform,
              },
            }, null, 2));
          ' "$VERSION" "$UPDATER_NAME" "$SIGNATURE" > dist-release/latest.json

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -lh dist-release
          echo "--- update manifest ---"
          cat dist-release/latest.json

      # Uploaded before publishing so that a failure in the publish step does
      # not throw away a ten-minute build.
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-sweep-macos-universal
          path: dist-release/
          retention-days: 14

      - name: Write release notes
        # A plain heredoc into a file, never a heredoc inside $( ). macOS ships
        # bash 3.2, which cannot parse the latter and fails with an unhelpful
        # "unexpected EOF while looking for matching )".
        run: |
          cat > release-notes.md <<'NOTES'
          Bulk Gmail cleanup as a native macOS app — group your mailbox by sender, then
          trash, archive, unsubscribe or filter an entire sender in one action.

          ## Install

          Download the `.dmg`, open it, and drag **Inbox Sweep** to Applications.
          (The `.zip` holds the same `.app` if you prefer.)

          The app is **universal** — one binary covering both Apple Silicon and Intel
          Macs. Requires macOS 10.15 or later.

          ### First launch

          The app is not signed with an Apple Developer certificate, so macOS will refuse
          to open it: *"Apple cannot check it for malicious software."* Clear the
          quarantine flag once:

          ```
          xattr -dr com.apple.quarantine "/Applications/Inbox Sweep.app"
          ```

          then right-click the app and choose **Open**. It launches normally after that.

          ### Setup

          You need your own free Google OAuth client of type **Desktop app** — Gmail's
          permissions are "restricted", so no app can ship a shared one. The app walks you
          through it on first run, and the README has the full steps plus a
          troubleshooting table.

          Updates install themselves from here: the app checks this release on launch and
          offers a one-click update, verified against a signing key built into the app.

          Signing in opens your real browser, because Google rejects OAuth inside embedded
          app windows. The app then holds a refresh token, so it signs itself back in
          silently rather than prompting hourly. Google expires that token after 7 days for
          apps in *Testing* status, which is where a personal client belongs — so expect to
          sign in roughly weekly.

          If you hit **"Access blocked: … has not completed the Google verification
          process"**, add your own Google account under **Test users** on the OAuth consent
          screen. That red screen means the account isn't an approved tester; it is not the
          same as the ordinary "unverified app" warning, which has an **Advanced** link you
          can click through.
          NOTES
          echo "--- notes ---"
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            # --target creates the tag at this commit when it doesn't exist,
            # which is what lets a manual run cut a fresh release.
            gh release create "$TAG" dist-release/* \
              --target "$GITHUB_SHA" \
              --title "Inbox Sweep $VERSION" \
              --notes-file release-notes.md
          fi
          gh release view "$TAG" --json tagName,assets \
            --jq '"published \(.tagName): \(.assets | map(.name) | join(", "))"'

          # An update is only real if the manifest and the bundle it names are
          # both reachable without credentials. Checking after publishing is
          # the only place this can be proven.
          echo "--- verifying the published update manifest ---"
          MANIFEST_URL="https://github.com/sparkly-quasar/inbox-sweep/releases/download/$TAG/latest.json"
          curl -fsSL "$MANIFEST_URL" -o /tmp/published.json || {
            echo "::error::latest.json is not downloadable at $MANIFEST_URL"; exit 1; }

          BUNDLE_URL=$(node -e 'console.log(require("/tmp/published.json").platforms["darwin-universal"].url)')
          echo "manifest points at: $BUNDLE_URL"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$BUNDLE_URL")
          if [ "$CODE" != "200" ]; then
            echo "::error::The manifest points at $BUNDLE_URL which returns HTTP $CODE. Auto-update would fail on download. GitHub rewrites spaces in asset names, so the bundle must be uploaded with a space-free filename."
            exit 1
          fi
          echo "update manifest verified: bundle reachable"

          # And the app's own check must see it, via the floating "latest" URL.
          curl -fsSL "https://github.com/sparkly-quasar/inbox-sweep/releases/latest/download/latest.json" \
            -o /tmp/floating.json || {
            echo "::error::releases/latest/download/latest.json is not reachable"; exit 1; }
          echo "floating latest.json resolves to version $(node -e 'console.log(require("/tmp/floating.json").version)')"
