name: release

on:
  push:
    tags: ['v*']
  # Lets a release be rebuilt without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: universal macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary. The runner is Apple Silicon,
          # so the Intel target is the one that must be added explicitly.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build universal .app and .dmg
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Verify the binary really is universal
        # A silently arch-specific build would install fine on this runner and
        # fail on half the Macs that download it, so fail the release instead.
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Inbox Sweep.app"
          BIN="$APP/Contents/MacOS/inbox-sweep"
          echo "Architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q "x86_64" || { echo "::error::missing x86_64 slice"; exit 1; }
          lipo -archs "$BIN" | grep -q "arm64"  || { echo "::error::missing arm64 slice"; exit 1; }

      - name: Package
        id: package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-release

          # ditto, not zip: it preserves the bundle's symlinks, permissions and
          # extended attributes, which a plain zip mangles.
          ditto -c -k --sequesterRsrc --keepParent \
            "$BUNDLE/macos/Inbox Sweep.app" \
            "dist-release/Inbox-Sweep-${VERSION}-macos-universal.zip"

          # The dmg filename carries Tauri's own version, so find it rather
          # than assuming.
          cp "$BUNDLE"/dmg/*.dmg "dist-release/Inbox-Sweep-${VERSION}-macos-universal.dmg"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -lh dist-release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          NOTES=$(cat <<'EOF'
          Bulk Gmail cleanup as a native macOS app — group your mailbox by sender, then
          trash, archive, unsubscribe or filter an entire sender in one action.

          ## Install

          Download the `.dmg`, open it, and drag **Inbox Sweep** to Applications.
          (The `.zip` contains the same `.app` if you prefer.)

          The app is **universal** — one binary for both Apple Silicon and Intel Macs.
          Requires macOS 10.15 or later.

          ### First launch

          The app is not signed with an Apple Developer certificate, so macOS will
          refuse to open it: *"Apple cannot check it for malicious software."* Clear
          the quarantine flag once:

          ```
          xattr -dr com.apple.quarantine "/Applications/Inbox Sweep.app"
          ```

          then right-click the app → **Open** → **Open**. It launches normally after that.

          ### Setup

          You need your own free Google OAuth client of type **Desktop app** — Gmail's
          permissions are "restricted", so no app can ship a shared one. The app walks
          you through it on first run; the README has the full steps and a
          troubleshooting table.

          Signing in opens your real browser, because Google rejects OAuth inside
          embedded app windows. The app then stays signed in — it holds a refresh
          token, so there is no hourly re-authentication.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* \
              --title "Inbox Sweep $VERSION" \
              --notes "$NOTES"
          fi
