name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets the macOS bundle job be run on demand from the Actions tab, which is
  # how to get a built .app without a Mac of your own.
  workflow_dispatch:

jobs:
  web:
    name: web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Only Chromium is needed; the e2e project pins that browser.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: desktop (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux backend. The app ships for macOS, but the OAuth and
      # storage logic is platform-neutral, so it is worth testing on the
      # runner that's free and fast.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  macos-bundle:
    name: macOS .app (smoke build, host arch only)
    # Proves the bundle still builds, without tagging a release. Deliberately
    # NOT universal — that is the release workflow's job, and it costs twice
    # the compile time. Run on demand only; macOS minutes bill at ten times
    # the Linux rate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build -- --bundles app

      - uses: actions/upload-artifact@v4
        with:
          # Named to make it obvious this is not the shippable universal build.
          name: inbox-sweep-macos-smoke-build-not-universal
          path: src-tauri/target/release/bundle/macos/
          retention-days: 7
