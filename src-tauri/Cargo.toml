[package]
name = "inbox-sweep"
version = "0.1.1"
description = "Bulk Gmail cleanup"
authors = ["sparkly-quasar"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri builds the app through this library; `main.rs` is a thin shim.
name = "inbox_sweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls: one fewer system dependency to get wrong when
# building on a machine this was never tested on.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["rt", "time"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[profile.release]
# Smaller bundle; this app is not CPU-bound.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
